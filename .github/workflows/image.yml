name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CERV_IMAGE: ghcr.io/mmrzaf/cerv:1.0
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CERV_IMAGE=${{ env.CERV_IMAGE }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://aimco.kdns.fr' }}
            PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL }}
            PUBLIC_CONTACT_PHONE=${{ vars.PUBLIC_CONTACT_PHONE }}
            PUBLIC_CONTACT_WHATSAPP=${{ vars.PUBLIC_CONTACT_WHATSAPP }}
            PUBLIC_CONTACT_TELEGRAM=${{ vars.PUBLIC_CONTACT_TELEGRAM }}
            PUBLIC_CONTACT_FORM_ENDPOINT=${{ vars.PUBLIC_CONTACT_FORM_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
